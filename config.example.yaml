# prusa-watch: your config. Copy to config.yaml.
#
# Only list what differs from the built-in defaults. Every setting and its default
# is in config.reference.yaml. `prusa-watch config` shows the effective result.
# Secrets come from .env via ${VAR}.

printer:
  host: 192.168.1.50                    # printer IP
  password: ${PRUSALINK_PASSWORD}       # Settings > Network > PrusaLink

camera:
  url: rtsp://192.168.1.51/live         # enable RTSP for the Buddy3D in the Prusa app

notify:
  ntfy:
    url: ${NTFY_URL:-https://ntfy.sh}
    topic: ${NTFY_TOPIC}
    token: ${NTFY_TOKEN:-}
    reply_topic: ${NTFY_REPLY_TOPIC:-}  # makes the alert buttons work away from home
  discord:
    webhook_url: ${DISCORD_WEBHOOK_URL:-}
  webhook:
    url: ${WEBHOOK_URL:-}

web:
  public_url: ${PUBLIC_URL:-}
  token: ${WEB_TOKEN:-}

timezone: America/New_York              # used when you enable time-based schedules

# Start with observation during both day and night. Enable automatic actions after tuning.
escalation:
  default_policy: watch_only
  schedules: []

# ── Common overrides (uncomment what you need) ─────────────────────────────
#
# camera:
#   roi: [0.15, 0.10, 0.85, 0.95]       # crop to the bed: biggest accuracy win
#
# decision:
#   sensitivity: 1.25                   # pause on moderate spaghetti too
#
# escalation:
#   default_policy: watch_only          # first few prints: notify only, never touch the printer
#   policies:
#     ask_first:                        # replace one built-in policy; the others stay
#       steps:
#         - {at: 0, buttons: [keep, act, stop]}
#         - {at: 5m, action: pause}
#         - {at: 2h, action: stop}      # give up on a print left paused with no answer
#   schedules: []                       # no night mode
