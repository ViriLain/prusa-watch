[package]
name = "prusa-watch"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Local camera-based failure monitoring and PrusaLink intervention for Prusa printers"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ViriLain/prusa-watch"
readme = "README.md"
exclude = ["/data", "/models", "/review", "/test-prints", "/build", "**/__pycache__", "**/*.egg-info", "/src/prusa_watch"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
font8x8 = "0.3.1"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "pnm"] }
md-5 = "0.11.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "rustls", "charset"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
# Keep the compatibility name at the configuration seam while using a maintained fork.
serde_yaml = { package = "serde_norway", version = "0.9.42" }
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter"] }
tract-onnx = "0.23.8"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = 1 }
suspicious = { level = "deny", priority = 1 }
await_holding_lock = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unsafe_derive_deserialize = "deny"
manual_let_else = "warn"
redundant_clone = "warn"
unchecked_time_subtraction = "warn"

# tract / image are slow unoptimized; keep our own crate debuggable.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
