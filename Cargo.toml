[package]
name = "prusa-watch"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
font8x8 = "0.3.1"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "pnm"] }
md-5 = "0.11.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "rustls", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
serde_yaml = "0.9.34"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter"] }
tract-onnx = "0.23.8"

[dev-dependencies]
tempfile = "3.27.0"

# tract / image are slow unoptimized; keep our own crate debuggable.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
