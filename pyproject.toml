[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prusa-watch"
version = "0.1.0"
description = "Local AI spaghetti detection for Prusa Core One using the Buddy3D camera RTSP stream and PrusaLink"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "onnxruntime>=1.17",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "tzdata>=2024.1",  # IANA zones for schedules (slim containers ship without them)
]

[project.optional-dependencies]
dev = ["pytest>=8", "onnx>=1.15"]

[project.scripts]
prusa-watch = "prusa_watch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prusa_watch = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
