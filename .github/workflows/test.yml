name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10"}   # oldest supported (requires-python)
          - {os: ubuntu-latest, python: "3.12"}   # what the Docker image runs
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}    # native Mac installs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  docker:
    name: docker build + model load
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build (downloads the real model from S3)
        run: docker build -t prusa-watch:ci .
      - name: Smoke test
        run: |
          docker run --rm prusa-watch:ci config --defaults > /dev/null
          docker run --rm --entrypoint python prusa-watch:ci -c \
            "from prusa_watch.detector import SpaghettiDetector; import numpy as np; d = SpaghettiDetector('/app/models/model-weights.onnx'); print(len(d.detect(np.zeros((720, 1280, 3), np.uint8), 0.08, 0.4)), 'boxes on a black frame')"
