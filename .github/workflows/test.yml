name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg (camera tests)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ffmpeg; else command -v ffmpeg || brew install ffmpeg; fi
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast 2>&1 | tee test.log
      - name: Report failing tests as annotations
        if: failure()
        shell: bash
        run: |
          # surface failures in the PR's checks view (and the checks API) without opening the log
          grep -E "^test .* FAILED$|panicked at" -A3 test.log | grep -v "^--$" | head -60 \
            | sed -e 's/%/%25/g' | while IFS= read -r line; do echo "::error title=cargo test::$line"; done

  docker:
    name: docker build + real model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build (compiles the binary, downloads the real model, checks it loads)
        run: docker build -t prusa-watch:ci .
      - name: Smoke test
        run: |
          docker run --rm prusa-watch:ci config --defaults > /dev/null
          docker run --rm prusa-watch:ci fetch-model | grep "already exists"
          docker run --rm --entrypoint ffmpeg prusa-watch:ci -hide_banner -version | head -1
